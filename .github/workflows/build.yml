# Reusable: one architecture's release build, its tests (the import/export-table checks
# included) and the artifact that lint and the release workflow consume. Called by ci.yml
# (build-x64, build-x86) and release.yml.
name: Build

on:
  workflow_call:
    inputs:
      arch:
        description: x64 or x86
        required: true
        type: string

# Checkout, cache and artifacts only; a caller cannot grant more than it holds itself.
permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.arch }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PRESET: ${{ inputs.arch == 'x86' && 'release-x86' || 'release' }}
    defaults:
      run:
        working-directory: repo
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          path: repo

      - name: Toolchain (vcpkg at the baseline, binary cache, LLVM)
        uses: ./repo/.github/actions/toolchain
        with:
          arch: ${{ inputs.arch }}

      # Which MSVC toolset (vcruntime + STL) and which clang-cl this run builds with, printed
      # before anything is compiled so that an import-table failure is attributable to a toolset
      # at a glance: MSVC >= 14.50 imports api-ms-win-core-synch-l1-2-0.dll for thread-safe
      # statics and atomic waits (AGENTS.md rule 13, Task 24). clang-cl takes the newest toolset
      # under <VS>\VC\Tools\MSVC unless VCToolsInstallDir points elsewhere; the probe prints the
      # one it actually resolves (its -### driver line names the MSVC include directory).
      - name: Toolset versions (MSVC, clang-cl)
        run: |
          $clang = Join-Path $env:PVDKIT_LLVM_DIR "clang-cl.exe"
          & $clang --version
          if ($env:VCToolsVersion) { "VCToolsVersion (vcvars): $env:VCToolsVersion" }
          if ($env:VCToolsInstallDir) { "VCToolsInstallDir: $env:VCToolsInstallDir" }
          $vsRoot = (Get-Item $env:PVDKIT_LLVM_DIR).Parent.Parent.Parent.Parent.Parent.FullName
          $toolsets = @(Get-ChildItem (Join-Path $vsRoot "VC\Tools\MSVC") -Directory -ErrorAction SilentlyContinue | Sort-Object Name)
          "MSVC toolsets under ${vsRoot}: $($toolsets.Name -join ', ')"
          $probe = Join-Path $env:RUNNER_TEMP "toolset-probe.cpp"
          Set-Content -LiteralPath $probe -Value "int main() { return 0; }"
          $driver = cmd /c "`"$clang`" -### /c `"$probe`" 2>&1" | Out-String
          $used = @([regex]::Matches($driver, 'VC\\+Tools\\+MSVC\\+([0-9.]+)') | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique)
          if ($used.Count -eq 0) { throw "clang-cl -### names no VC\Tools\MSVC directory:`n$driver" }
          "MSVC toolset resolved by clang-cl: $($used -join ', ')"

      - name: Configure
        run: cmake --preset $env:PRESET

      - name: Build
        run: cmake --build --preset $env:PRESET --parallel

      - name: Test
        run: ctest --preset $env:PRESET

      - name: Upload the plugins and their package staging
        uses: actions/upload-artifact@v7
        with:
          name: plugins-${{ inputs.arch }}
          if-no-files-found: error
          path: |
            repo/build/${{ env.PRESET }}/plugins/*/*.pvd
            repo/build/${{ env.PRESET }}/plugins/*/package/**
